<header class="site-header">
  <div class="wrap site-header__top">
    <div class="brand">
      <a class="brand-logo-link" href="{{ "/" | relative_url }}">
        <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="" class="site-logo" width="64" height="64">
      </a>
      <div class="brand-text">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        {% if site.tagline %}
          <div class="site-tagline">{{ site.tagline }}</div>
        {% endif %}
        {% if site.podcast.author %}
          <div class="site-authors">By {{ site.podcast.author }}</div>
        {% endif %}
      </div>
    </div>

    <div class="header-platforms" aria-label="Listen and subscribe">
      <a href="{{ site.links.apple }}" class="header-platform header-platform--apple" target="_blank" rel="noopener" title="Apple Podcasts">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
        </svg>
        <span>Apple</span>
      </a>
      <a href="{{ site.links.spotify }}" class="header-platform header-platform--spotify" target="_blank" rel="noopener" title="Spotify">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        <span>Spotify</span>
      </a>
      <a href="{{ site.links.youtube }}" class="header-platform header-platform--youtube" target="_blank" rel="noopener" title="YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span>YouTube</span>
      </a>
      <a href="{{ site.links.substack }}" class="header-platform header-platform--substack" target="_blank" rel="noopener" title="Substack">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/>
        </svg>
        <span>Substack</span>
      </a>
      <a href="{{ site.links.rss }}" class="header-platform header-platform--rss" target="_blank" rel="noopener" title="RSS">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.503 20.752c0 1.794-1.456 3.248-3.251 3.248-1.796 0-3.252-1.454-3.252-3.248 0-1.794 1.456-3.248 3.252-3.248 1.795.001 3.251 1.454 3.251 3.248zm-6.503-12.572v4.811c6.05.062 10.96 4.966 11.022 11.009h4.817c-.062-8.71-7.118-15.758-15.839-15.82zm0-3.368c10.58.046 19.152 8.594 19.183 19.188h4.817c-.03-13.231-10.755-23.954-24-24v4.812z"/>
        </svg>
        <span>RSS</span>
      </a>
    </div>
  </div>

  <nav class="site-nav" aria-label="Primary">
    <div class="wrap site-nav__inner">
      <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Beliefs</a>
      <a href="{{ "/concepts/" | relative_url }}"{% if page.url == "/concepts/" %} aria-current="page"{% endif %}>Concepts</a>
      <a href="{{ "/faq/" | relative_url }}"{% if page.url == "/faq/" %} aria-current="page"{% endif %}>Econ of AI FAQ</a>
    </div>
  </nav>
</header>
